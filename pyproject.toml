[project]
name = "pdf-to-markdown"
version = "0.1.0"
description = "在 macOS 本地将扫描版 PDF 转换为 Markdown"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mineru[all]",
    "openai>=1.70,<3",
    "pypdf>=6,<7",
    "python-dotenv>=1,<2",
]

[project.scripts]
pdf2md = "pdf_to_md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_md"]
